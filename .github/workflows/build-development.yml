name: Build Development ZIP
run-name: Development ZIP from ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require a development branch
        env:
          SELECTED_REF: ${{ github.ref }}
        run: |
          case "$SELECTED_REF" in
            refs/heads/main) echo '::error::Select a development branch, not main.'; exit 1 ;;
            refs/heads/*) ;;
            *) echo '::error::Select a branch, not a tag.'; exit 1 ;;
          esac
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Test packaging and translations
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Build mod ZIP
        run: python3 .github/scripts/build_mod.py
      - name: Upload installable mod ZIP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/FS25_Courseplay.zip
          archive: false
          if-no-files-found: error
          retention-days: 30
