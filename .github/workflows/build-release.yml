name: Publish Live Release
run-name: Publish live release from main

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-live-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Require main
        env:
          SELECTED_REF: ${{ github.ref }}
        run: |
          if [ "$SELECTED_REF" != 'refs/heads/main' ]; then
            echo '::error::Live releases must be run from main.'
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Test packaging
        run: python3 -m unittest discover -s .github/scripts -p 'test_build_mod.py' -v
      - name: Build mod ZIP
        id: package
        run: python3 .github/scripts/build_mod.py
      - name: Refuse an existing version tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          # Listing must succeed: an API failure must not be mistaken for a missing tag.
          tags=$(gh api --paginate "repos/$GH_REPO/git/matching-refs/tags/$VERSION" --jq '.[].ref')
          if printf '%s\n' "$tags" | grep -Fxq "refs/tags/$VERSION"; then
            echo '::error::This version tag already exists. Increase the version in modDesc.xml before releasing.'
            exit 1
          fi
      - name: Publish release and ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.package.outputs.version }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          gh release create "$VERSION" dist/FS25_Courseplay.zip \
            --target "$RELEASE_SHA" \
            --title "Courseplay for FS25 v$VERSION" \
            --generate-notes \
            --latest
